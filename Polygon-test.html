<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clip-Path Polygon Explorer</title>
  <style>
    :root{
      --gap: 10px;
      --bg: #f6f8fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    h2{ margin: 0 0 16px; }
    .layout{ display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }

    .shape-card, .editor-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .shape-wrap{
      position: relative;
      width: 320px;
      height: 420px;
    }
    .shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      clip-path: polygon(50% 0%, 100% 25%, 100% 100%, 25% 100%, 0% 75%, 0% 0%);
      transition: clip-path 0.12s ease;
      border-radius: 8px;
    }
    .markers{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible; /* ensure markers at the edges are not clipped by the SVG viewport */
    }
    .marker-circle{ fill:#ef4444; stroke:#fff; stroke-width:.5px }
    .marker-text{ fill:#ffffff; font-size:4px; font-weight:400; text-anchor:middle; dominant-baseline:central; paint-order: stroke; stroke: rgba(0,0,0,.35); stroke-width:.35px; }

    .controls{
      display: grid;
      gap: 12px;
    }

    .sliders{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .slider-group{
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    .slider-group header{
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--muted); margin-bottom: 6px;
    }
    .slider-row{ display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    input[type=range]{ width: 100%; }
    .value{ font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; color: var(--muted); }

    input[type="text"] {
      width: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      box-sizing: border-box;
      background: #fff;
      line-height: 1.6;
      white-space: nowrap;
      overflow-x: auto;
    }
    .row{ display:flex; gap: 10px; align-items:center; justify-content:flex-start; flex-wrap: wrap; }
    button {
      margin-top: 8px;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }
    .primary{ background: var(--primary); border-color: var(--primary); color: #fff; }
    .note{ color: var(--muted); font-size: 12px; }
    @media (max-width: 840px){ .layout{ grid-template-columns: 1fr; } .shape-wrap{ width: 100%; max-width: 420px; height: 380px; } }
  </style>
</head>
<body>
  <h2>🎯 Clip-Path Polygon Explorer</h2>

  <div class="layout">
    <div class="shape-card">
      <div class="shape-wrap">
        <div class="shape" id="shape"></div>
        <svg class="markers" id="markers" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Polygon point markers"></svg>
      </div>
    </div>

    <div class="editor-card">
      <div class="controls">
        <label for="polygonInput">Edit the polygon string (copy-friendly):</label>
        <input type="text" id="polygonInput" value="polygon(50% 0%, 100% 25%, 100% 100%, 25% 100%, 0% 75%, 0% 0%)" />
        <div class="row">
          <button class="primary" id="applyBtn" title="Apply text to the shape">Apply</button>
          <button id="copyBtn" title="Copy polygon string">Copy</button>
          <span class="note">Tip: You can type directly in the box or use the sliders below. Both stay in sync.</span>
        </div>

        <div id="sliders" class="sliders" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script>
    // --- Utilities ---
    function parsePolygon(input){
      if(!input) return null;
      const m = input.match(/polygon\s*\((.*)\)/i);
      if(!m) return null;
      // split points by commas not within parentheses (no parens expected but safe)
      const raw = m[1].trim();
      const parts = raw.split(/\s*,\s*/);
      const values = [];
      for(const pt of parts){
        const nums = pt.trim().split(/\s+/);
        if(nums.length < 2) return null;
        const x = parseFloat(nums[0].replace('%',''));
        const y = parseFloat(nums[1].replace('%',''));
        if(isNaN(x) || isNaN(y)) return null;
        values.push(x, y);
      }
      return values; // flat [x1,y1,x2,y2,...] in percent
    }

    function formatPolygon(values){
      // values is flat array of percents
      const pts = [];
      for(let i=0;i<values.length;i+=2){
        const x = clamp(values[i], 0, 100);
        const y = clamp(values[i+1], 0, 100);
        pts.push(`${round2(x)}% ${round2(y)}%`);
      }
      return `polygon(${pts.join(', ')})`;
    }

    function round2(n){ return Math.round(n * 100) / 100; }
    function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }

    // --- State ---
    const shape = document.getElementById('shape');
    const textarea = document.getElementById('polygonInput');
    const slidersHost = document.getElementById('sliders');
    const applyBtn = document.getElementById('applyBtn');
    const copyBtn = document.getElementById('copyBtn');
    const markers = document.getElementById('markers');

    let values = parsePolygon(textarea.value) || [50,0, 100,25, 100,100, 25,100, 0,75, 0,0];

    function drawMarkers(){
      // Clear existing
      while(markers.firstChild) markers.removeChild(markers.firstChild);
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('aria-label','Polygon points');
      for(let i=0;i<values.length;i+=2){
        const x = clamp(values[i],0,100);
        const y = clamp(values[i+1],0,100);
        const idx = (i/2)+1;
        const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
        circle.setAttribute('cx', String(x));
        circle.setAttribute('cy', String(y));
        circle.setAttribute('r', '2.6');
        circle.setAttribute('class','marker-circle');
        const label = document.createElementNS('http://www.w3.org/2000/svg','text');
        label.setAttribute('x', String(x));
        label.setAttribute('y', String(y));
        label.setAttribute('class','marker-text');
        label.textContent = String(idx);
        g.appendChild(circle);
        g.appendChild(label);
      }
      markers.appendChild(g);
    }

    // --- UI Builders ---
    function buildSliders(){
      slidersHost.innerHTML = '';
      const pointCount = values.length / 2;
      for(let i=0;i<pointCount;i++){
        const base = i*2;
        const group = document.createElement('div');
        group.className = 'slider-group';
        group.innerHTML = `
          <header>
            <strong>Point ${i+1}</strong>
            <span class="note">(x%, y%)</span>
          </header>
          <div class="slider-row">
            <input type="range" min="0" max="100" step="0.5" value="${values[base]}" aria-label="Point ${i+1} X percent" />
            <span class="value" data-role="xval">${round2(values[base])}%</span>
          </div>
          <div class="slider-row">
            <input type="range" min="0" max="100" step="0.5" value="${values[base+1]}" aria-label="Point ${i+1} Y percent" />
            <span class="value" data-role="yval">${round2(values[base+1])}%</span>
          </div>
        `;
        const [xRangeRow, yRangeRow] = group.querySelectorAll('.slider-row');
        const xRange = xRangeRow.querySelector('input');
        const yRange = yRangeRow.querySelector('input');
        const xOut = xRangeRow.querySelector('[data-role="xval"]');
        const yOut = yRangeRow.querySelector('[data-role="yval"]');

        xRange.addEventListener('input', () => {
          values[base] = parseFloat(xRange.value);
          xOut.textContent = `${round2(values[base])}%`;
          syncFromValues();
        });
        yRange.addEventListener('input', () => {
          values[base+1] = parseFloat(yRange.value);
          yOut.textContent = `${round2(values[base+1])}%`;
          syncFromValues();
        });

        slidersHost.appendChild(group);
      }
    }

    // --- Sync helpers ---
    function syncFromValues(){
      const str = formatPolygon(values);
      shape.style.clipPath = str;
      textarea.value = str; // keep text box editable and copy friendly
      drawMarkers();
    }

    function syncFromTextarea(apply=false){
      const parsed = parsePolygon(textarea.value);
      if(parsed && parsed.length === values.length){
        values = parsed;
        shape.style.clipPath = formatPolygon(values);
        drawMarkers();
        // update sliders only when applying or when valid live edit
        const groups = slidersHost.querySelectorAll('.slider-group');
        for(let i=0;i<groups.length;i++){
          const base = i*2;
          const inputs = groups[i].querySelectorAll('input[type=range]');
          const outs = groups[i].querySelectorAll('.value');
          inputs[0].value = values[base];
          inputs[1].value = values[base+1];
          outs[0].textContent = `${round2(values[base])}%`;
          outs[1].textContent = `${round2(values[base+1])}%`;
        }
      } else if(apply){
        // If apply clicked but text is invalid, keep previous values and correct text
        textarea.value = formatPolygon(values);
      }
    }

    // --- Events ---
    textarea.addEventListener('input', () => {
      // live-parse but don't force if invalid
      const parsed = parsePolygon(textarea.value);
      if(parsed && parsed.length === values.length){
        values = parsed;
        shape.style.clipPath = formatPolygon(values);
        drawMarkers();
        // light update: don't rebuild groups; update displayed values
        const groups = slidersHost.querySelectorAll('.slider-group');
        for(let i=0;i<groups.length;i++){
          const base = i*2;
          const outs = groups[i].querySelectorAll('.value');
          outs[0].textContent = `${round2(values[base])}%`;
          outs[1].textContent = `${round2(values[base+1])}%`;
        }
      }
    });

    applyBtn.addEventListener('click', () => {
      syncFromTextarea(true);
    });

    copyBtn.addEventListener('click', async () => {
      try{
        await navigator.clipboard.writeText(textarea.value);
        copyBtn.textContent = 'Copied!';
        setTimeout(()=>copyBtn.textContent='Copy', 1200);
      }catch(e){
        // fallback
        textarea.select();
        document.execCommand('copy');
      }
    });

    // --- Init ---
    buildSliders();
    syncFromValues();
  </script>
</body>
</html>
