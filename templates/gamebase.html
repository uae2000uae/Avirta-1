<!DOCTYPE html>
<html lang="en" style="font-size: -1;">
<head>

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-ZYNK9VZ6B6');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Avirta{% endblock %}</title>
    <!-- Common CSS files --><!-- Common JavaScript files -->
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" type="text/css">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet" type="text/css">
    <!-- Apply persistent view zoom from localStorage on all game pages -->
    <script>
      (function() {
        const ZK = 'avirta_view_zoom';
        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

        function applyViewZoom(scale) {
          scale = clamp(Number(scale) || 1, 0.5, 2.0);
          const html = document.documentElement;
          const body = document.body;
          if (!body) return; // Wait until body exists

          // Reset previous
          html.style.zoom = '';
          body.style.transform = '';
          body.style.transformOrigin = '';
          body.style.width = '';

          // Try native zoom (Chromium/Edge/WebKit)
          try { html.style.zoom = String(scale); } catch (e) {}
          const ua = navigator.userAgent.toLowerCase();
          const isFirefox = ua.includes('firefox');
          const zoomApplied = !!html.style.zoom;
          if (isFirefox || !zoomApplied) {
            // Fallback for Firefox
            body.style.transform = 'scale(' + scale + ')';
            body.style.transformOrigin = '0 0';
            body.style.width = (100 / scale) + '%';
          }
        }

        function readZoom() {
          const val = localStorage.getItem(ZK);
          const num = parseFloat(val);
          return (isNaN(num) ? 1.0 : num);
        }

        function initZoom() {
          applyViewZoom(readZoom());
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initZoom);
        } else {
          initZoom();
        }
      })();
    </script>
    <!-- Optional JavaScript files - can be included in child templates -->
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
    </header>
    <div class="container">
        <!-- Flash messages section -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-message {% if category == 'error' %}error{% elif category == 'success' %}success{% elif category == 'result-correct' %}result-correct{% else %}success{% endif %}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Main content block -->
        {% block content %}{% endblock %}
    </div>

    <!-- Optional JavaScript at the end of the body -->
    {% block scripts %}{% endblock %}
</body>
</html>
