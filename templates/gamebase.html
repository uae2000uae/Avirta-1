<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Avirta{% endblock %}</title>
    <!-- Common CSS files --><!-- Common JavaScript files -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="../static/css/style.css" rel="stylesheet" type="text/css">
    <link href="../static/css/custom.css" rel="stylesheet" type="text/css">
    <!-- Optional JavaScript files - can be included in child templates -->
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
    </header>
    <div class="container">
        <!-- Flash messages section -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-message {% if category == 'error' %}error{% elif category == 'success' %}success{% elif category == 'result-correct' %}result-correct{% else %}success{% endif %}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Main content block -->
        {% block content %}{% endblock %}
    </div>

    <!-- Optional JavaScript at the end of the body -->
    {% block scripts %}{% endblock %}
</body>
</html>
