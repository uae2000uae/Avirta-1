<link href="../static/css/style.css" rel="stylesheet" type="text/css">
{% extends "base.html" %}

{% block title %}Avirta - Create Room{% endblock %}

{% block content %}
<div class="page-section">
    <h2>Create a "Knowleade Columns" Game Board</h2>
  <form action="{{ url_for('create_room') }}" method="post" class="form-group-xx" data-max-categories="{{ max_categories }}">
        <div class="form-group-equal-md">
            <label for="room_name">Room Name:</label>
            <input type="text" id="room_name" name="room_name" required placeholder="Game room title">
        </div>
        <div class="form-group-equal-sm">
            <label for="host_name">Host (Player 1):</label>
            <input type="text" id="host_name" name="host_name" required placeholder="Player 1 (the host)">
        </div>
        <div class="form-group-inline">
            <label>Additional Players:</label>
            <div class="form-group-grid">
                {% for i in range(1, max_players) %}
                <div class="form-group-equal-sm">
                    <input type="text" id="player{{ i }}" name="additional_players" placeholder="Player {{ i+1 }} (optional)">
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="form-group-inline">
          <label>Select Question Types:</label>
          <div class="form-group-equal-sm">
            <div class=category-checkbox>
              <input type="checkbox" id="type_text" name="question_types" value="text" checked>
              <label for="type_text">Text</label>
            </div>
            <div class=category-checkbox>
              <input type="checkbox" id="type_multiple_choice" name="question_types" value="multiple_choice" checked>
              <label for="type_multiple_choice">Multiple Choice</label>
            </div>
            <div class=category-checkbox>
              <input type="checkbox" id="type_true_false" name="question_types" value="true_false" checked>
              <label for="type_true_false">True/False</label>
            </div>
          </div>
        </div>
        <div class="form-group-inline">
          <label>Select Categories (up to {{ max_categories }}):</label>
            <div class="categories-grid">
                {% for category_id, category in categories.items() %}

                <div class="category-checkbox">
                    <input type="checkbox" id="category_{{ category_id }}" name="categories" value="{{ category_id }}">
                    <label for="category_{{ category_id }}" class="text-center">{{ category.name }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
<div class="form-actions">
      <button type="submit">Create Room</button>
            <button class="button secondary"><a class="text-clear" href="{{ url_for('index') }}">Cancel</a></button>
        </div>
    </form>
</div>

<script>
(function() {
  function getSelectedValues(name) {
    const nodes = document.querySelectorAll('input[name="' + name + '"]:checked');
    return Array.from(nodes).map(n => n.value);
  }

  function updateCategoryAvailability() {
    const types = getSelectedValues('question_types');

    const params = new URLSearchParams();
    if (types.length) params.set('question_types', types.join(','));

    fetch('/api/fastest/category_availability?' + params.toString())
      .then(r => r.json())
      .then(data => {
        const required = data.required_per_category || 10;
        const availability = data.categories || {};
        document.querySelectorAll('input[name="categories"]').forEach(cb => {
          const cid = cb.value;
          const info = availability[cid] || {count: 0, enough: false};
          const label = document.querySelector('label[for="' + cb.id + '"]');
          if (!info.enough) {
            cb.checked = false;
            cb.disabled = true;
            if (label) {
              label.classList.add('disabled');
              label.title = `Not enough questions for selected filters (has ${info.count}, needs ${required})`;
            }
          } else {
            cb.disabled = false;
            if (label) {
              label.classList.remove('disabled');
              label.title = '';
            }
          }
        });
      })
      .catch(() => { /* ignore errors; keep current state */ });
  }

  function enforceMaxCategories() {
    const form = document.querySelector('form[data-max-categories]');
    if (!form) return;
    const max = parseInt(form.getAttribute('data-max-categories')) || 7;
    const selected = Array.from(document.querySelectorAll('input[name="categories"]:checked'));
    const unchecked = Array.from(document.querySelectorAll('input[name="categories"]:not(:checked)'));
    if (selected.length >= max) {
      unchecked.forEach(cb => { cb.disabled = true; });
    } else {
      unchecked.forEach(cb => {
        const label = document.querySelector('label[for="' + cb.id + '"]');
        const unavailable = label && label.classList.contains('disabled');
        if (!unavailable) {
          cb.disabled = false;
        }
      });
    }
  }

  function onFiltersChanged() {
    updateCategoryAvailability();
    // enforce later, after availability applied
    setTimeout(enforceMaxCategories, 0);
  }

  document.addEventListener('DOMContentLoaded', function() {
    // Bind change listeners to filters
    document.querySelectorAll('input[name="question_types"]').forEach(el => {
      el.addEventListener('change', onFiltersChanged);
    });

    // Also enforce max categories on category selection
    document.querySelectorAll('input[name="categories"]').forEach(el => {
      el.addEventListener('change', enforceMaxCategories);
    });

    // Initial update
    onFiltersChanged();
  });
})();
</script>

{% endblock %}
