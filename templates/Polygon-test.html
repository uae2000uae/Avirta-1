<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clip-Path Polygon Explorer</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    .shape {
      width: 300px;
      height: 400px;
      background: #3498db;
      clip-path: polygon(50% 0%, 100% 25%, 100% 100%, 25% 100%, 0% 75%, 0% 0%);
      transition: clip-path 0.3s ease;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 100px;
      font-family: monospace;
      font-size: 14px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>🎯 Clip-Path Polygon Explorer</h2>
  <div class="shape" id="shape"></div>

  <label for="polygonInput">Edit the polygon points below:</label>
  <textarea id="polygonInput">polygon(50% 0%, 100% 25%, 100% 100%, 25% 100%, 0% 75%, 0% 0%)</textarea>
  <br>
  <button onclick="updateClipPath()">Apply Shape</button>

  <script>
    function updateClipPath() {
      const input = document.getElementById('polygonInput').value;
      document.getElementById('shape').style.clipPath = input;
    }
  </script>

</body>
</html>
