# Cloud Build config to build and deploy Avirta to Cloud Run service "avirta"
# Trigger this build from your repo to produce a container and deploy.

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: avirta
  # Optional: runtime service account email for Cloud Run
  # Example: my-run-sa@my-project.iam.gserviceaccount.com
  _RUN_SA_EMAIL: ""
  # You can override _REGION, _SERVICE_NAME and _RUN_SA_EMAIL at trigger time

steps:
  # 0) Prepare Secret Manager access for the Cloud Run runtime service account
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - >-
        set -e;
        SA="${_RUN_SA_EMAIL}";
        if [ -z "$SA" ]; then
          NUM=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)');
          SA="${NUM}-compute@developer.gserviceaccount.com";
        fi;
        echo "Using runtime SA: $SA";
        gcloud services enable secretmanager.googleapis.com || true;
        gcloud secrets add-iam-policy-binding AI_Token --member="serviceAccount:${SA}" --role="roles/secretmanager.secretAccessor" || true;

  # 1) Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA", "."]

  # 2) Push the image to Container Registry / Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA"]

  # 3) Deploy to Cloud Run using the built image
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA",
        "--region=${_REGION}",
        "--platform=managed",
        "--allow-unauthenticated",
        "--port=8080",
        "--set-secrets=AI_Token=AI_Token:latest"
      ]

  # 4) Ensure public (unauthenticated) access (roles/run.invoker)
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "beta",
        "run",
        "services",
        "add-iam-policy-binding",
        "${_SERVICE_NAME}",
        "--region=${_REGION}",
        "--member=allUsers",
        "--role=roles/run.invoker"
      ]

images:
  - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA"

timeout: "1600s"

# Log to Cloud Logging by default; remove or adjust as needed
options:
  logging: CLOUD_LOGGING_ONLY