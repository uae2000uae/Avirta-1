# Cloud Build config to deploy Avirta to Cloud Run service "avirta" from source.
# Uses Cloud Run's source-based deploy (Google Cloud buildpacks) — no Docker image to manage.

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: avirta
  # You can override _REGION and _SERVICE_NAME at trigger time

steps:
  # 1) Deploy to Cloud Run directly from source
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--source=.",
        "--region=${_REGION}",
        "--platform=managed",
        "--allow-unauthenticated",
        "--port=8080",
        # STOPGAP: game state and question/report data live in this instance's
        # memory and local filesystem, which are not shared across instances.
        # Pin to a single always-on instance so multiplayer state stays
        # consistent. Remove these once state is moved to Firestore/Redis.
        "--min-instances=1",
        "--max-instances=1",
        # Route a given client back to the same instance (belt-and-suspenders).
        "--session-affinity",
        # To sign session cookies with a stable key, create a "SECRET_KEY"
        # secret in Secret Manager and append it below, e.g.:
        #   SECRET_KEY=SECRET_KEY:latest
        "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"
      ]

  # 2) Ensure public (unauthenticated) access (roles/run.invoker)
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "beta",
        "run",
        "services",
        "add-iam-policy-binding",
        "${_SERVICE_NAME}",
        "--region=${_REGION}",
        "--member=allUsers",
        "--role=roles/run.invoker"
      ]

timeout: "1600s"

# Log to Cloud Logging by default; remove or adjust as needed
options:
  logging: CLOUD_LOGGING_ONLY