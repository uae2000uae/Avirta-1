name: Secret scanning (Gitleaks)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Scan repo for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history on PRs

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        id: gitleaks
        with:
          args: detect --source . --no-banner --redact --report-format sarif --report-path gitleaks.sarif --config .gitleaks.toml || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      - name: Fail build on secret findings
        shell: bash
        run: |
          if jq '.runs[0].results | length' gitleaks.sarif | grep -q '^[1-9]'; then
            echo "Secret(s) detected by Gitleaks. See the 'Security' tab or workflow artifacts for details." >&2
            exit 1
          fi
          echo "No secrets detected by Gitleaks."
