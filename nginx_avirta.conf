server {
    listen 80;
    server_name _;  # Replace with your domain name if available

    # Application location
    location / {
        proxy_pass http://unix:/tmp/avirta.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running requests
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Static files location
    location /static {
        alias /var/www/static;  # Path to static files
        expires 30d;
    }

    # Error logs
    error_log /var/log/nginx/avirta_error.log;
    access_log /var/log/nginx/avirta_access.log;
}
